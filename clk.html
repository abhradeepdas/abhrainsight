<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PES 2026</title>
 
 <style>
 
 
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
}

body{
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
max-width:1600px;
}

#title{
font-size:clamp(20px,2vw,30px);
font-weight:600;
letter-spacing:8px;
color:#9baacd;
margin-bottom:18px;
user-select:none;
 
}

#message{
min-height:40px;
font-size:clamp(18px,2vw,30px);
font-weight:500;
color:#b7c0ba;
margin-bottom:35px;
}

.clock{
display:flex;
justify-content:center;
align-items:flex-end;
gap:15px;
}

#clock{
font-size:clamp(100px,15vw,210px);
font-weight:700;
line-height:0.95;
font-family:"Segoe UI",Arial,sans-serif;
white-space:nowrap;
}

#ampm{
font-size:clamp(18px,2vw,30px);
font-weight:600;
color:#8c8c8c;
margin-bottom:20px;
}

#status{
margin-top:40px;
font-size:clamp(25px,2vw,24px);
letter-spacing:2px;
color:#b2aaa4;
}

#countdown{
margin-top:10px;
font-size:clamp(36px,5vw,60px);
font-family:Consolas,monospace;
font-weight:700;
color:#fff;
}

@media(max-width:700px){

.container{
padding:15px;
}

#title{
letter-spacing:4px;
margin-bottom:10px;
}

#message{
margin-bottom:25px;
font-size:22px;
}

.clock{
gap:8px;
}

#clock{
font-size:clamp(90px,22vw,120px);
}

#ampm{
margin-bottom:10px;
font-size:20px;
}

#status{
margin-top:25px;
}

}
     
     
     
     
     .exam-over{

font-size:clamp(50px,6vw,80px);

font-weight:800;

color:#fff;

animation:slideDown .8s ease;

}

.submit-paper{

margin-top:20px;

font-size:clamp(26px,3vw,40px);

font-weight:700;

color:#ffeb3b;

animation:softBlink 2.5s ease-in-out infinite;

}

@keyframes softBlink{

0%{
opacity:1;
}

50%{
opacity:0.25;
}

100%{
opacity:1;
}
 </style>
 
 
 </head>
 
<body>

<div class="container">

    <div id="title">
     <b>PES 2026</b> (Edition 1)
    </div>

    <div id="message"></div>

    <div class="clock">
        <div id="clock">12:00</div>
        <div id="ampm">AM</div>
    </div>

    <div id="status">
        Waiting For Exam
    </div>

    <div id="countdown">
      
    </div>

    <div style="
        margin-top:40px;
        color:#745bfd;
        font-size:16px;
        letter-spacing:1px;">
        AbhraInsight
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDc4NGvL-IC6QwsuIRhktLFTzNy634HSyo",
authDomain:"pes-clock.firebaseapp.com",
databaseURL:"https://pes-clock-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"pes-clock",
storageBucket:"pes-clock.firebasestorage.app",
messagingSenderId:"586966366325",
appId:"1:586966366325:web:e885ea450e11e6f826e03c",
measurementId:"G-TWQD24QHP6"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const message=document.getElementById("message");
const status=document.getElementById("status");
const clock=document.getElementById("clock");
const ampm=document.getElementById("ampm");

onValue(ref(db,"pes2026"), snapshot => {

    const d = snapshot.val() || {};

    message.textContent = d.message || "";

    const title = document.getElementById("title");

    switch(d.examStatus){

        case "waiting":

            status.textContent = "Exam Yet Not Started";

            document.body.style.background = "#F5F5F0"; // Off White
            document.body.style.color = "#000";

            title.style.color = "#333";
            message.style.color = "#444";
            clock.style.color = "#000";
            ampm.style.color = "#444";
            status.style.color = "#444";

            break;

        case "running":

            status.textContent = "Exam Running";

            document.body.style.background = "#000";
            document.body.style.color = "#FFF";

            title.style.color = "#9baacd";
            message.style.color = "#b7c0ba";
            clock.style.color = "#FFF";
            ampm.style.color = "#8c8c8c";
            status.style.color = "#b2aaa4";

            break;

     case "finished":

    document.body.style.background = "#C62828";
    document.body.style.color = "#FFF";

    title.style.color = "#FFF";
    message.style.color = "#FFF";
    clock.style.color = "#FFF";
    ampm.style.color = "#FFF";

    status.innerHTML = `
        <div class="exam-over">
            EXAM IS OVER
        </div>

        <div class="submit-paper">
            PLEASE SUBMIT YOUR ANSWER SCRIPTS QUIETLY
        </div>
    `;

    document.querySelector(".clock").style.transform = "scale(0.55)";
    document.querySelector(".clock").style.transition = "0.8s";

    break;

        default:

            status.textContent = "Exam Yet Not Started";

            document.body.style.background = "#F5F5F0";
            document.body.style.color = "#000";

            title.style.color = "#333";
            message.style.color = "#444";
            clock.style.color = "#000";
            ampm.style.color = "#444";
            status.style.color = "#444";

    }

});

function tick(){

    const now=new Date();

    let h=now.getHours();
    const m=String(now.getMinutes()).padStart(2,"0");

    const ap=h>=12?"PM":"AM";

    h=h%12;
    if(h===0) h=12;

    clock.textContent=`${String(h).padStart(2,"0")}:${m}`;
    ampm.textContent=ap;

}

tick();

setInterval(tick,1000);

</script>

</body></html>
