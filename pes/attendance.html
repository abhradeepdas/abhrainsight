
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PES Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-4">

    <h2 class="mb-4">
        PES Attendance
    </h2>

    <div class="row g-3 mb-4">

        <div class="col-md-4">

            <label class="form-label">
                Select Class
            </label>

            <select
                id="classSelect"
                class="form-select"
            >

                <option value="">
                    Select Class
                </option>

                <option value="5">
                    Class 5
                </option>

                <option value="6">
                    Class 6
                </option>

                <option value="7">
                    Class 7
                </option>

                <option value="8">
                    Class 8
                </option>

            </select>

        </div>


        <div class="col-md-4">

            <label class="form-label">
                Select Exam
            </label>

            <select
                id="examSelect"
                class="form-select"
            >

                <option value="">
                    Select Exam
                </option>

                <option value="Test 1">
                    Test 1
                </option>

                <option value="Test 2">
                    Test 2
                </option>

                <option value="Test 3">
                    Test 3
                </option>

                <option value="Test 4">
                    Test 4
                </option>

            </select>

        </div>

    </div>



<div class="table-responsive">

    <table class="table table-bordered">

       <thead> <tr> <th>Student</th> <th>Attendance</th> </tr> </thead>

        <tbody id="attendanceTableBody">

        </tbody>

    </table>

</div>



    <button
        id="saveAttendance"
        class="btn btn-primary"
    >
        Save Attendance
    </button>

</div>


<script
    type="module"
    src="js/attendance.js">
</script>

</body>

</html>
