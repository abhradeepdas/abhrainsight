<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Admin Login | AbhraInsight PES</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fa;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            border: 0;
            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, .10);
        }

        .login-title {
            color: #1e3a8a;
            font-weight: 700;
        }

    </style>

</head>


<body>


    <div class="card login-card p-4">


        <div class="text-center mb-4">

            <h3 class="login-title">
                AbhraInsight PES
            </h3>

            <p class="text-muted mb-0">
                Administrator Login
            </p>

        </div>


        <form id="loginForm">


            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Admin email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <div
                id="loginError"
                class="alert alert-danger d-none"
            ></div>


            <button
                type="submit"
                id="loginButton"
                class="btn btn-primary w-100"
            >
                Login
            </button>


        </form>


    </div>


    <script
        type="module"
        src="js/admin-login.js"
    ></script>


</body>

</html>
