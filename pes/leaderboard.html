<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>PES Leaderboard</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>
body{background:#f5f7fa;font-family:Segoe UI,Arial}
.navbar{background:#1e3a8a}
.card{border:0;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.table thead{background:#1e3a8a;color:#fff}
.table tbody tr{transition:.2s;cursor:pointer}
.table tbody tr:hover{background:#eef4ff}
.student{font-weight:600;color:#1f2937}
.badge-top{background:#fff3cd;color:#8a6d00;padding:4px 10px;border-radius:20px}
</style></head>
<body>
<nav class='navbar navbar-dark'><div class='container'><span class='navbar-brand'>AbhraInsight | PES Leaderboard</span></div></nav>
<div class='container py-4'>
<div class="card p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center">

        <div>
            <h2 id="leaderboardTitle">Leaderboard</h2>
            <p class="text-muted mb-0">
                Progress Evaluation Series
            </p>
        </div>

        <span class="badge-top">
            Updated: <span id="updatedDate">-</span>
        </span>

    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <label class="form-label">Class</label>

            <select class="form-select" id="leaderboardClass">
                <option value="">Select Class</option>
                <option value="5">Class 5</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
            </select>
        </div>
    </div>

</div>
<input id='s' class='form-control mb-3' placeholder='Search student'>
<div class='card p-3'><div class='table-responsive'>
    
    <table class='table align-middle'>
<thead><tr><th>Rank</th><th>Student</th><th>Average</th><th>Trend</th></tr></thead>
<tbody id="leaderboardTableBody">

</tbody></table>

</div></div></div>
<script type="module" src="js/leaderboard.js"></script></body></html>
